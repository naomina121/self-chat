<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セルフチャットメモ</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2b2b;--sub:#7a746a;--line:#e3ddd0;
--c0:#e8735a;--c1:#4a90a4;--c2:#8e7cc3;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.app{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px}
h1{font-size:1.1rem;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button:hover{background:#faf7f0}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{opacity:.85}
.hidden{display:none!important}
/* setup */
#setup{background:var(--card);border-radius:14px;padding:24px;margin:auto 0;box-shadow:0 2px 10px #0001}
#setup p{color:var(--sub);font-size:.9rem;margin:.4em 0 1em}
.nrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.nrow input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
/* chat */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px 10px}
.bar div{display:flex;gap:6px;flex-wrap:wrap}
#log{flex:1;overflow-y:auto;background:var(--card);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.empty{color:var(--sub);text-align:center;margin-top:40px;font-size:.9rem}
.msg{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start}
.msg.right{flex-direction:row-reverse}
.icon{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:700;text-align:center;line-height:1.1;padding:4px;overflow:hidden;word-break:break-all}
.bubble{position:relative;max-width:calc(100% - 140px);background:#fff;border:2px solid var(--col);border-radius:14px;padding:9px 13px;white-space:pre-wrap;word-break:break-word}
.bubble::before{content:"";position:absolute;top:18px;width:10px;height:10px;background:#fff;border:2px solid var(--col);transform:rotate(45deg)}
.left .bubble::before{left:-7px;border-right:0;border-top:0}
.right .bubble::before{right:-7px;border-left:0;border-bottom:0}
.tools{display:none;gap:4px;align-self:center}
.msg:hover .tools{display:flex}
.tools button{font-size:.7rem;padding:2px 7px}
/* input */
.input{margin-top:10px;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 -2px 10px #0001}
.radios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.radios input{position:absolute;opacity:0}
.radios label{padding:5px 14px;border:2px solid var(--col);border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--col)}
.radios input:checked+label{background:var(--col);color:#fff}
.radios input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.send{display:flex;gap:8px;align-items:flex-end}
textarea{field-sizing: content;flex:1;min-height:70px;max-height:180px;resize:vertical;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.hint{font-size:.75rem;color:var(--sub);margin-top:4px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:.92}
</style>
</head>
<body>
<div class="app">

<section id="setup">
  <h1>セルフチャットメモ</h1>
  <p>対話する人の名前を入力してください(2〜3人)。3人目は空欄でもOKです。</p>
  <div class="nrow"><span class="dot" style="background:var(--c0)"></span><input id="n0" maxlength="12" placeholder="1人目(必須)"></div>
  <div class="nrow"><span class="dot" style="background:var(--c1)"></span><input id="n1" maxlength="12" placeholder="2人目(必須)"></div>
  <div class="nrow"><span class="dot" style="background:var(--c2)"></span><input id="n2" maxlength="12" placeholder="3人目(任意)"></div>
  <button class="primary" id="start">はじめる</button>
</section>

<section id="chat" class="hidden">
  <div class="bar">
    <h1>セルフチャットメモ</h1>
    <div>
      <button id="copy">コピー</button>
      <button id="dl" class="primary">メモをダウンロード</button>
      <button id="clear">クリア</button>
      <button id="back">名前変更</button>
    </div>
  </div>
  <div id="log"></div>
  <div class="input">
    <div class="radios" id="radios"></div>
    <div class="send">
      <textarea id="text" placeholder="セリフを入力…"></textarea>
      <button class="primary" id="send">送信</button>
    </div>
    <div class="hint">Ctrl + Enter(Macは⌘ + Enter)で送信 / 会話は自動でこのブラウザに一時保存されます</div>
  </div>
</section>

</div>
<div id="toast"></div>

<script>
(function(){
  var KEY = "selfChatMemo.v1";
  var names = [], msgs = [], cur = 0;
  var $ = function(id){return document.getElementById(id)};

  function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1600)}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({names:names,msgs:msgs}))}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.names&&d.names.length>=2){names=d.names;msgs=d.msgs||[];return true}}catch(e){}return false}

  function col(i){return "var(--c"+i+")"}
  function fontSize(n){var l=n.length;return l<=2?"1rem":l<=3?".85rem":l<=5?".68rem":".58rem"}

  function renderRadios(){
    var box=$("radios");box.innerHTML="";
    names.forEach(function(n,i){
      var id="r"+i,w=document.createElement("span");w.style.setProperty("--col",col(i));
      var r=document.createElement("input");r.type="radio";r.name="who";r.id=id;r.value=i;r.checked=(i===cur);
      r.onchange=function(){cur=i;$("text").focus()};
      var l=document.createElement("label");l.htmlFor=id;l.textContent=n;
      w.appendChild(r);w.appendChild(l);box.appendChild(w);
    });
  }

  function renderLog(){
    var log=$("log");log.innerHTML="";
    if(!msgs.length){log.innerHTML='<div class="empty">まだ会話がありません。話者を選んで入力してみましょう。</div>';return}
    msgs.forEach(function(m,idx){
      var side=(m.who%2===0)?"left":"right";
      var row=document.createElement("div");row.className="msg "+side;row.style.setProperty("--col",col(m.who));
      var ic=document.createElement("div");ic.className="icon";ic.style.background=col(m.who);
      ic.style.fontSize=fontSize(names[m.who]);ic.textContent=names[m.who];
      var b=document.createElement("div");b.className="bubble";b.textContent=m.text;
      var t=document.createElement("div");t.className="tools";
      var e=document.createElement("button");e.textContent="編集";e.onclick=function(){
        var v=prompt("セリフを編集",m.text);if(v!==null&&v.trim()){m.text=v;save();renderLog()}};
      var d=document.createElement("button");d.textContent="削除";d.onclick=function(){
        msgs.splice(idx,1);save();renderLog()};
      t.appendChild(e);t.appendChild(d);
      row.appendChild(ic);row.appendChild(b);row.appendChild(t);log.appendChild(row);
    });
    log.scrollTop=log.scrollHeight;
  }

  function toText(){return msgs.map(function(m){return names[m.who]+":"+m.text}).join("\n").replace(/^/,"")}
  function toTextFull(){return msgs.map(function(m){return names[m.who]+"\uFF1A"+m.text}).join("\n")}

  function send(){
    var v=$("text").value.replace(/\s+$/,"");
    if(!v.trim())return;
    msgs.push({who:cur,text:v});$("text").value="";save();renderLog();$("text").focus();
  }

  function show(chat){$("setup").classList.toggle("hidden",chat);$("chat").classList.toggle("hidden",!chat)}

  $("start").onclick=function(){
    var n=[0,1,2].map(function(i){return $("n"+i).value.trim()}).filter(Boolean);
    if(n.length<2){toast("2人以上の名前を入力してください");return}
    // 名前変更時は、人数が同じ場合のみ過去ログを引き継ぐ
    if(names.length!==n.length)msgs=[];
    names=n;cur=0;save();renderRadios();renderLog();show(true);$("text").focus();
  };
  $("send").onclick=send;
  $("text").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&!e.isComposing){e.preventDefault();send()}
  });
  $("copy").onclick=function(){
    var t=toTextFull();if(!t){toast("コピーする内容がありません");return}
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("コピーしました")},function(){
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");toast("コピーしました")}catch(e){toast("コピーに失敗しました")}ta.remove();
    });
  };
  $("dl").onclick=function(){
    if(!msgs.length){toast("ダウンロードする内容がありません");return}
    var d=new Date(),p=function(x){return String(x).padStart(2,"0")};
    var fn="chat-memo-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+".txt";
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([toTextFull()+"\n"],{type:"text/plain;charset=utf-8"}));
    a.download=fn;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast("ダウンロードしました");
  };
  $("clear").onclick=function(){
    if(msgs.length&&confirm("会話をすべて消去します。先にダウンロードしましたか?")){msgs=[];save();renderLog()}
  };
  $("back").onclick=function(){
    names.forEach(function(n,i){$("n"+i).value=n});show(false);
  };

  if(load()){names.forEach(function(n,i){$("n"+i).value=n});renderRadios();renderLog();show(true)}
})();
</script>
</body>
</html>
